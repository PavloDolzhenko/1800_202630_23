<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Play · Spot the Bot</title>
    <link rel="icon" href="images/logo.svg">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600&family=Nunito+Sans:wght@400;600;700&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0">
    <link rel="stylesheet" href="styles/style.css">
    <script>document.documentElement.dataset.theme = localStorage.getItem("theme") || "light";</script>
    <script type="module" src="src/main.js"></script>
    <script type="module" src="src/game.js"></script>
</head>
<body>
    <!-- --[ Navbar ]-- -->
    <site-header back="activities.html">Play</site-header>

    <main class="page">
        <!-- --[ How to play ]-- -->
        <section id="gameIntro" class="card stack">
            <h2>How to play</h2>
            <img src="images/tutorialAct.jpg" alt="A labelled example of a game round" class="shot">
            <ol class="steps">
                <li>The title and what you need to do.</li>
                <li>How long you have been playing.</li>
                <li>Pick the card that answers the question.</li>
                <li>A link to the tips page if you get stuck.</li>
            </ol>
            <button id="introNextBtn" class="btn block" disabled>Loading...</button>
            <a href="tips.html" target="_blank" class="link center">Read the tips first</a>
        </section>

        <!-- --[ Question ]-- -->
        <section id="gameLayout" class="stack d-none">
            <div class="game-bar">
                <div><h1 id="gameTitle"></h1><p id="gameQuestion" class="muted"></p></div>
                <span class="chip"><i class="icon">timer</i><span><span id="timer">0.0</span>s</span></span>
            </div>
            <div id="questionScreen" class="options">
                <button id="option1Card" class="card option">
                    <img id="option1Img" alt="Option 1">
                    <p id="option1Text" class="d-none"></p>
                    <span>Option 1</span>
                </button>
                <span class="or">or</span>
                <button id="option2Card" class="card option">
                    <img id="option2Img" alt="Option 2">
                    <p id="option2Text" class="d-none"></p>
                    <span>Option 2</span>
                </button>
            </div>
            <button id="finishBtn" class="btn ghost d-none">Finish practice</button>
        </section>

        <!-- --[ Answer ]-- -->
        <section id="resultScreen" class="card stack center d-none">
            <i id="resultIcon" class="icon result-icon"></i>
            <h2 id="resultTitle"></h2>
            <img id="resultExpImg" alt="Explanation" class="shot d-none">
            <p id="resultExp"></p>
            <p id="resultMessage" class="chip"></p>
            <button id="nextBtn" class="btn block">Next</button>
        </section>

        <!-- --[ Finished ]-- -->
        <section id="finalScreen" class="card stack center d-none">
            <i id="finalIcon" class="icon result-icon"></i>
            <h2 id="finalTitle"></h2>
            <p id="finalMessage" class="chip"></p>
            <a href="activities.html" class="btn block">Try another one</a>
        </section>
    </main>

    <!-- --[ Bottom nav ]-- -->
    <site-nav></site-nav>
</body>
</html>
