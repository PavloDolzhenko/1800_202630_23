<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Profile · Spot the Bot</title>
    <link rel="icon" href="images/logo.svg">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600&family=Nunito+Sans:wght@400;600;700&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0">
    <link rel="stylesheet" href="styles/style.css">
    <script>document.documentElement.dataset.theme = localStorage.getItem("theme") || "light";</script>
    <script type="module" src="src/main.js"></script>
    <script type="module" src="src/profile.js"></script>
</head>
<body>
    <!-- --[ Navbar ]-- -->
    <site-header back="landing.html">Profile</site-header>

    <main class="page narrow">
        <section class="card stack center">
            <!-- --[ Avatar ]-- -->
            <span id="profileAvatar" class="avatar xl">?</span>
            <div><h1>Profile</h1><p class="muted">Manage your profile information.</p></div>
            <div id="profileAlert" class="alert d-none" role="alert"></div>

            <!-- --[ Details ]-- -->
            <form id="profileForm" class="stack">
                <div class="field">
                    <div class="field-head">
                        <label for="username">Username</label>
                        <button type="button" id="editBtn" class="link" disabled><i class="icon">edit</i> Edit</button>
                    </div>
                    <input type="text" id="username" placeholder="Pick a username" autocomplete="username"
                        minlength="3" maxlength="20" pattern="[A-Za-z0-9_]+"
                        title="3 to 20 characters. Letters, numbers and _ only." required disabled>
                </div>
                <label class="field">Email<input type="email" id="email" disabled></label>
                <div class="two">
                    <button type="button" id="resetBtn" class="btn ghost" disabled>Reset</button>
                    <button type="submit" id="saveBtn" class="btn" disabled>Save</button>
                </div>
            </form>

            <!-- --[ Log out ]-- -->
            <button type="button" id="logoutBtn" class="btn danger block"><i class="icon">logout</i>Log Out</button>
        </section>
    </main>

    <!-- --[ Bottom nav ]-- -->
    <site-nav></site-nav>
</body>
</html>
