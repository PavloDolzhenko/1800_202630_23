<!DOCTYPE html>
<html lang="en">

<head>
    <title>Spot the Bot</title>
    <meta name="comp1800 template" content="My 1800 App">

    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Google icons (same as every other page) -->
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,1,0">

    <!-- Pavlo : Ron skeleton.css has the navbar, profile.css has the profile page styles. -->
    <link rel="stylesheet" href="./styles/skeleton.css">
    <link rel="stylesheet" href="./styles/profile.css">

</head>
<body>

    <!-- Top navbar -->
    <!-- Pavlo : Ron this is the same grey curved bar, but it has a Back button on the left and
         the Settings gear on the right (we're already on Profile, so the person icon would just reload the page). -->
    <header class="top-nav">

        <!-- Pavlo - this button takes you back to the page you were on before (profile.js does that part) -->
        <a href="index.html" id="backBtn" class="icon-btn back-btn" aria-label="Back">
            <span class="material-symbols-outlined">arrow_back</span>
            <small>Back</small>
        </a>

        <!-- Pavlo - this button leads to the settings page (gear icon, top-right) -->
        <a href="settings.html" class="icon-btn" aria-label="Settings">
            <span class="material-symbols-outlined">settings</span>
        </a>

    </header>

    <!-- Pavlo : Ron this is our profile section. profile.js fills it in from Firestore
         (users/<their user id>) once Firebase knows who is logged in. -->
    <main class="page-content">
    <div class="profile-card">
        <span class="material-symbols-outlined profile-logo">person</span>
        <h1>Profile</h1>
        <p class="settings-subtitle">Manage your profile information.</p>
        <img src="./images/profile.jpg" alt="Profile Image" class="profile-image">

        <!-- Pavlo - the pencil. It unlocks the Username box so you can change it.
             It starts disabled and profile.js turns it on once the profile has loaded. -->
        <button type="button" id="editBtn" class="edit-btn" aria-label="Edit Profile" disabled>
            <span class="material-symbols-outlined">edit</span>
        </button>

        <!-- Pavlo : Ron this box shows messages like "Profile saved!". It stays hidden until profile.js shows it. -->
        <div id="profileAlert" class="alert alert-dark d-none" role="alert"></div>

        <!-- Pavlo : Ron the inputs are inside a <form> so pressing Enter or the Save button both save.
             The username rules (3 to 20 characters, letters / numbers / _ only) are on the input itself,
             so the browser checks them for us before profile.js saves anything. -->
        <form id="profileForm">
            <div class="profile-info">
                <div class="info-item">
                    <label for="username">Username:</label>
                    <input type="text" id="username" placeholder="Pick a username" autocomplete="username"
                        minlength="3" maxlength="20" pattern="[A-Za-z0-9_]+"
                        title="3 to 20 characters. Letters, numbers and _ only." required disabled>
                </div>

                <!-- Pavlo - email always stays locked. It's the email they log in with, so changing it
                     needs Firebase to send them a verification email first (we can add that later). -->
                <div class="info-item">
                    <label for="email">Email:</label>
                    <input type="email" id="email" disabled>
                </div>
            </div>
            <div>
                <!-- Pavlo - Save and Reset only work while you're editing -->
                <button type="submit" id="saveBtn" class="save-btn" aria-label="Save Changes" disabled>
                    <span class="material-symbols-outlined">save</span>
                </button>
                <button type="button" id="resetBtn" class="reset-btn" aria-label="Reset Changes" disabled>
                    <span class="material-symbols-outlined">refresh</span>
                </button>
            </div>
        </form>

        <!-- Pavlo : Ron this logs you out of your account and takes you to the login page -->
        <button type="button" id="logoutBtn" class="logout-btn">
            <span class="material-symbols-outlined">logout</span>
            Log Out
        </button>
    </div>
    </main>

     <!-- Bottom navbar -->
    <!-- Pavlo - this is the bottom part: a round menu button on the left and a round Chat button on the right. -->
    <nav class="bottom-nav">

        <!-- Pavlo - this hidden checkbox is the "open/closed" switch for the menu.
             Clicking the round button (the <label> below) ticks it, and the CSS
             shows the Home / Search / Activities / Add Friend buttons. No JavaScript needed. -->
        <input type="checkbox" id="menu-toggle" class="menu-toggle">

        <!-- Pavlo - this is the round button bottom-left. It opens and closes the menu. -->
        <label for="menu-toggle" class="circle-btn menu-btn" aria-label="Open menu">
            <span class="material-symbols-outlined">ads_click</span>
        </label>

        <!-- Pavlo - these are the 4 buttons that pop out when the menu is open. -->
        <div class="menu-items">

            <!-- Pavlo - this button leads to the Home page -->
            <a href="index.html" class="menu-item item-home">
                <span class="material-symbols-outlined">home</span>
                Home
            </a>

            <!-- Pavlo - this button leads to the Search page -->
            <a href="search.html" class="menu-item item-search">
                <span class="material-symbols-outlined">search</span>
                Search
            </a>

            <!-- Pavlo - this button leads to the Activities page (the AI-or-Real quizzes) -->
            <a href="activities.html" class="menu-item item-activities">
                <span class="material-symbols-outlined">sports_esports</span>
                Activities
            </a>

            <!-- Pavlo - this button leads to the Add Friend page -->
            <a href="add-friend.html" class="menu-item item-add-friend">
                <span class="material-symbols-outlined">person_add</span>
                Add Friend
            </a>

        </div>

        <!-- Pavlo - this button leads to the Chat page (round button bottom-right) -->
        <a href="chat.html" class="circle-btn chat-btn" aria-label="Chat">
            <span class="material-symbols-outlined">forum</span>
            <small>Chat</small>
        </a>

    </nav>


    <!---------------------------------------------->
    <!-- Your own JavaScript functions go here    -->
    <!---------------------------------------------->

    <!-- Link to scripts of your own -->
    <script type="module" src="./src/main.js"></script>
    <script type="module" src="./src/profile.js"></script>

</body>

</html>
