<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Log In · Spot the Bot</title>
    <link rel="icon" href="images/logo.svg">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600&family=Nunito+Sans:wght@400;600;700&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0">
    <link rel="stylesheet" href="styles/style.css">
    <script>document.documentElement.dataset.theme = localStorage.getItem("theme") || "light";</script>
    <script type="module" src="src/main.js"></script>
    <script type="module" src="src/login.js"></script>
</head>
<body>
    <!-- --[ Navbar ]-- -->
    <site-header back="index.html">Account</site-header>

    <main class="page narrow">
        <section class="card stack center">
            <img src="images/logo.svg" alt="" class="logo sm">
            <div id="authAlert" class="alert error d-none" role="alert"></div>

            <!-- --[ Log in ]-- -->
            <div id="loginView" class="stack">
                <div><h1>Welcome back</h1><p class="muted">Log in to keep spotting bots.</p></div>
                <form id="loginForm" class="stack">
                    <label class="field">Email<input type="email" id="loginEmail" autocomplete="email" required></label>
                    <label class="field">Password<input type="password" id="loginPassword" autocomplete="current-password" required></label>
                    <button type="submit" class="btn block">Log In</button>
                </form>
                <p class="muted">Don't have an account? <button type="button" id="toSignup" class="link">Sign up</button></p>
            </div>

            <!-- --[ Sign up ]-- -->
            <div id="signupView" class="stack d-none">
                <div><h1>Create an account</h1><p class="muted">It only takes a minute.</p></div>
                <form id="signupForm" class="stack">
                    <div class="two">
                        <label class="field">First name<input type="text" id="signupFirstName" autocomplete="given-name" required></label>
                        <label class="field">Last name<input type="text" id="signupLastName" autocomplete="family-name" required></label>
                    </div>
                    <label class="field">Email<input type="email" id="signupEmail" autocomplete="email" required></label>
                    <label class="field">Password<input type="password" id="signupPassword" autocomplete="new-password" minlength="6" required><small>At least 6 characters.</small></label>
                    <button type="submit" class="btn block">Create Account</button>
                </form>
                <p class="muted">Already have an account? <button type="button" id="toLogin" class="link">Log in</button></p>
            </div>
        </section>
    </main>
</body>
</html>
