<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Chat · Spot the Bot</title>
    <link rel="icon" href="images/logo.svg">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600&family=Nunito+Sans:wght@400;600;700&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0">
    <link rel="stylesheet" href="styles/style.css">
    <script>document.documentElement.dataset.theme = localStorage.getItem("theme") || "light";</script>
    <script type="module" src="src/main.js"></script>
    <script type="module" src="src/chatting.js"></script>
</head>
<body>
    <!-- --[ Navbar ]-- -->
    <site-header back="chat.html">Chat</site-header>

    <main class="page narrow tight">
        <!-- --[ Friend ]-- -->
        <div class="row">
            <span id="friendAvatar" class="avatar">?</span>
            <strong id="friendName">Loading...</strong>
        </div>

        <div id="chatAlert" class="alert error d-none" role="alert"></div>

        <!-- --[ Messages ]-- -->
        <div id="messages" class="card messages"><p class="list-message">Loading messages...</p></div>

        <!-- --[ Type a message ]-- -->
        <form id="messageForm" class="message-form">
            <input type="text" id="messageInput" class="input" placeholder="Type a message..." autocomplete="off" maxlength="500" aria-label="Message" disabled>
            <button type="submit" id="sendBtn" class="btn" aria-label="Send" disabled><i class="icon">send</i></button>
        </form>
    </main>

    <!-- --[ Bottom nav ]-- -->
    <site-nav></site-nav>
</body>
</html>
