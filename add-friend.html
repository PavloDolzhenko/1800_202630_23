<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Add Friend · Spot the Bot</title>
    <link rel="icon" href="images/logo.svg">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600&family=Nunito+Sans:wght@400;600;700&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0">
    <link rel="stylesheet" href="styles/style.css">
    <script>document.documentElement.dataset.theme = localStorage.getItem("theme") || "light";</script>
    <script type="module" src="src/main.js"></script>
    <script type="module" src="src/addFriend.js"></script>
</head>
<body>
    <!-- --[ Navbar ]-- -->
    <site-header back="chat.html">Add Friend</site-header>

    <main class="page narrow">
        <!-- --[ No username warning ]-- -->
        <p id="noUsernameNote" class="alert d-none">You don't have a username yet. <a href="profile.html">Set one in your Profile</a> so friends can find you.</p>

        <!-- --[ Search ]-- -->
        <label class="search"><i class="icon">search</i><input type="search" id="searchInput" placeholder="Search username..." autocomplete="off" maxlength="20" disabled></label>

        <!-- --[ Results ]-- -->
        <ul id="results" class="list"><li class="list-message">Start searching to find new friends!</li></ul>
    </main>

    <!-- --[ Result row ]-- -->
    <template id="userRowTemplate">
        <li class="row">
            <span class="avatar"></span>
            <span class="grow"><strong class="user-name ellipsis"></strong><small class="user-status"></small></span>
            <button type="button" class="icon-btn row-btn"><i class="icon"></i></button>
        </li>
    </template>

    <!-- --[ Bottom nav ]-- -->
    <site-nav></site-nav>
</body>
</html>
