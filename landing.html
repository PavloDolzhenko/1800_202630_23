<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Home · Spot the Bot</title>
    <link rel="icon" href="images/logo.svg">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600&family=Nunito+Sans:wght@400;600;700&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0">
    <link rel="stylesheet" href="styles/style.css">
    <script>document.documentElement.dataset.theme = localStorage.getItem("theme") || "light";</script>
    <script type="module" src="src/main.js"></script>
    <script type="module" src="src/landing.js"></script>
</head>
<body>
    <!-- --[ Navbar ]-- -->
    <site-header>Home</site-header>

    <main class="page wide">

            <i class="icon wave">waving_hand</i>
            <h1>Hello, <span id="userName">there</span>!</h1>
            <p class="muted">What do you want to do today?</p>
        </section>

        <!-- --[ Shortcuts ]-- -->
        <section class="grid small">
            <a href="activities.html" class="card tile">
                <img src="images/learningActivities.jpg" alt="">
                <div><h3>Activities</h3><p>Learn to spot AI by playing.</p></div>
            </a>
            <a href="tips.html" class="card tile">
                <img src="images/tipsTextImages.jpg" alt="">
                <div><h3>Tips</h3><p>The clues that give AI away.</p></div>
            </a>
            <a href="chat.html" class="card tile">
                <img src="images/chatCard.jpg" alt="">
                <div><h3>Chat</h3><p>Talk with friends and family.</p></div>
            </a>
            <a href="profile.html" class="card tile">
                <img src="images/profileBlank.jpg" alt="">
                <div><h3>Profile</h3><p>Pick your username.</p></div>
            </a>
        </section>
    </main>

    <!-- --[ Bottom nav ]-- -->
    <site-nav></site-nav>

</html>
