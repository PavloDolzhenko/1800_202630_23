<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Settings · Spot the Bot</title>
    <link rel="icon" href="images/logo.svg">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600&family=Nunito+Sans:wght@400;600;700&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0">
    <link rel="stylesheet" href="styles/style.css">
    <script>document.documentElement.dataset.theme = localStorage.getItem("theme") || "light";</script>
    <script type="module" src="src/main.js"></script>
    <script type="module" src="src/settings.js"></script>
</head>
<body>
    <!-- --[ Navbar ]-- -->
    <site-header back="landing.html">Settings</site-header>

    <main class="page narrow">
        <!-- --[ Title ]-- -->
        <section class="page-head">
            <span class="badge"><i class="icon">tune</i></span>
            <h1>Settings</h1>
            <p class="muted">Make Spot the Bot feel right for you.</p>
        </section>

        <!-- --[ Appearance ]-- -->
        <section class="stack">
            <h2 class="label">Appearance</h2>
            <label class="row">
                <span class="badge sm"><i class="icon">contrast</i></span>
                <span class="grow"><strong>Dark mode</strong><small>Easier on the eyes at night.</small></span>
                <input type="checkbox" id="darkModeToggle" class="switch">
            </label>
            <p id="accountNote" class="muted center"></p>
        </section>
    </main>

    <!-- --[ Bottom nav ]-- -->
    <site-nav></site-nav>
</body>
</html>
