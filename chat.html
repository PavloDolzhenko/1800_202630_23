<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Chats · Spot the Bot</title>
    <link rel="icon" href="images/logo.svg">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600&family=Nunito+Sans:wght@400;600;700&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0">
    <link rel="stylesheet" href="styles/style.css">
    <script>document.documentElement.dataset.theme = localStorage.getItem("theme") || "light";</script>
    <script type="module" src="src/main.js"></script>
    <script type="module" src="src/chat.js"></script>
</head>
<body>
    <!-- --[ Navbar ]-- -->
    <site-header back="landing.html">Chats</site-header>

    <main class="page narrow">
        <!-- --[ Search ]-- -->
        <label class="search"><i class="icon">search</i><input type="search" id="searchInput" placeholder="Search friends..." autocomplete="off"></label>

        <!-- --[ Chats ]-- -->
        <ul id="chatList" class="list"><li class="list-message">Loading your chats...</li></ul>

        <a href="add-friend.html" class="btn ghost block"><i class="icon">person_add</i>Add Friends</a>
    </main>

    <!-- --[ Chat row ]-- -->
    <template id="chatRowTemplate">
        <li>
            <a class="row" href="#">
                <span class="avatar"></span>
                <span class="grow">
                    <strong class="user-name ellipsis"></strong>
                    <small class="user-status ellipsis"><i class="icon new-icon">notifications</i> <span class="status-text"></span></small>
                </span>
                <small class="chat-date"></small>
            </a>
        </li>
    </template>

    <!-- --[ Bottom nav ]-- -->
    <site-nav></site-nav>
</body>
</html>
